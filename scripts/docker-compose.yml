version: '3.8'

x-build-args: &build-args
  VERSION: ${RAVBOT_VERSION:-0.3.0-alpha}
  BUILD_DATE: ${BUILD_DATE:-}
  VCS_REF: ${VCS_REF:-}

services:
  ravbot:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
      args:
        <<: *build-args
    image: ravbot:${RAVBOT_VERSION:-0.3.0-alpha}
    container_name: ravbot
    restart: unless-stopped
    ports:
      - "18800:18800"   # Gateway WebSocket
      - "18801:18801"   # Dashboard/REST API
    volumes:
      - ravbot_data:/home/ravbot/.ravbot
    environment:
      - RAVBOT_LOG_LEVEL=${RAVBOT_LOG_LEVEL:-info}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    networks:
      - ravbot_network
    healthcheck:
      test: ["CMD", "ravbot", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M

  ravbot-test:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.test
    image: ravbot-test:${RAVBOT_VERSION:-0.3.0-alpha}
    container_name: ravbot-test

  ravbot-dev:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: scripts/Dockerfile.dev
    image: ravbot-dev:${RAVBOT_VERSION:-0.3.0-alpha}
    container_name: ravbot-dev
    ports:
      - "18802:18800"
      - "18803:18801"
    volumes:
      - ..:/app            # live source mount for development
      - ravbot_dev_data:/root/.ravbot
    stdin_open: true
    tty: true

volumes:
  ravbot_data:
    driver: local
  ravbot_dev_data:
    driver: local

networks:
  ravbot_network:
    driver: bridge
